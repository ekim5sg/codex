<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orbit of Ideas</title>
    <style>
      :root {
        --bg: #090c17;
        --panel: #12172a;
        --panel-soft: #182038;
        --ink: #ebf1ff;
        --muted: #9aa8ca;
        --accent: #64c7ff;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        color: var(--ink);
        background: radial-gradient(circle at 20% 20%, #18203f 0%, #0c1122 35%, #070a14 75%);
      }

      .app {
        max-width: 1300px;
        margin: 0 auto;
        padding: 16px;
      }

      .title {
        margin: 6px 2px 14px;
        font-weight: 700;
        letter-spacing: 0.03em;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
        gap: 14px;
      }

      .card {
        background: linear-gradient(165deg, rgba(23, 30, 52, 0.93), rgba(14, 19, 35, 0.95));
        border: 1px solid rgba(120, 150, 245, 0.2);
        border-radius: 18px;
        padding: 14px;
        box-shadow: 0 6px 26px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(255,255,255,0.02);
      }

      .orbit-wrap { width: 100%; overflow: hidden; border-radius: 14px; }

      .controls { display: flex; flex-direction: column; gap: 12px; }
      .section {
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(152, 174, 245, 0.18);
        border-radius: 12px;
        padding: 10px;
      }

      .section h3 { margin: 0 0 8px; font-size: 0.96rem; }
      .pill {
        display: inline-block;
        border-radius: 999px;
        padding: 4px 10px;
        background: rgba(100, 199, 255, 0.14);
        border: 1px solid rgba(100, 199, 255, 0.4);
        margin-bottom: 8px;
        font-size: 0.9rem;
      }

      .slider-row { margin-bottom: 8px; }
      .slider-row label {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 0.86rem;
        margin-bottom: 3px;
      }

      input[type="range"], input[type="text"], textarea, select {
        width: 100%;
        border-radius: 8px;
        border: 1px solid rgba(153, 171, 224, 0.3);
        background: #0d1327;
        color: var(--ink);
      }

      input[type="range"] { accent-color: var(--accent); }
      input[type="text"], textarea { padding: 8px; }
      textarea { min-height: 66px; resize: vertical; }

      .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
      button {
        border: 1px solid rgba(144, 169, 245, 0.35);
        background: linear-gradient(180deg, #1f2b50, #151f3a);
        color: var(--ink);
        border-radius: 10px;
        padding: 8px 12px;
        cursor: pointer;
      }
      button:hover { filter: brightness(1.08); }
      button.danger {
        border-color: rgba(255, 121, 133, 0.45);
        background: linear-gradient(180deg, #4a1f31, #311726);
      }

      .idea-list { display: flex; flex-direction: column; gap: 8px; max-height: 220px; overflow: auto; }
      .idea-item {
        width: 100%;
        text-align: left;
        padding: 9px;
        border-radius: 10px;
        border: 1px solid rgba(144, 169, 245, 0.25);
        background: rgba(15, 24, 46, 0.95);
      }
      .idea-item.active {
        border-color: rgba(100, 199, 255, 0.75);
        box-shadow: 0 0 0 2px rgba(100, 199, 255, 0.18);
      }
      .muted { color: var(--muted); font-size: 0.85rem; }

      .delta-grid {
        margin-top: 8px;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }
      .delta {
        padding: 6px 8px;
        border-radius: 8px;
        font-size: 0.8rem;
        border: 1px solid transparent;
      }
      .delta-pos { background: rgba(78, 218, 168, 0.12); border-color: rgba(78, 218, 168, 0.45); }
      .delta-neg { background: rgba(255, 127, 151, 0.12); border-color: rgba(255, 127, 151, 0.45); }
      .delta-flat { background: rgba(159, 183, 220, 0.12); border-color: rgba(159, 183, 220, 0.35); }

      @media (max-width: 930px) {
        .layout { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script data-trunk src="Cargo.toml"></script>
  </body>
</html>
