[package]
name = "mobile-zipper"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "Blob",
  "Document",
  "Element",
  "Event",
  "File",
  "FileList",
  "HtmlAnchorElement",
  "HtmlButtonElement",
  "HtmlElement",
  "HtmlInputElement",
  "Node",
  "Url",
  "Window",
] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
pretty_assertions = "1"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
